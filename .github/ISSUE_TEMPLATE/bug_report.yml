name: Bug report
description: Report a reproducible problem in whoop-cli
title: "bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `whoop --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, architecture, and installation method.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command and redacted output. Never include tokens or private WHOOP data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
